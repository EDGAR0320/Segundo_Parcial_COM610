
name: CD - Docker y Despliegue EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: com610-production
  cancel-in-progress: false

jobs:
  test:
    name: Verificar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Jest
        run: npm test

  publish:
    name: Construir y publicar imagen
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_USERNAME }}/com610-libros:${{ github.sha }}

  deploy:
    name: Desplegar y verificar EC2
    needs: publish
    runs-on: [self-hosted, linux, x64, com610]
    timeout-minutes: 15

    steps:
      - name: Configurar acceso SSH local seguro
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          test "$SSH_HOST" = "127.0.0.1"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/com610_key
          chmod 600 ~/.ssh/com610_key
          ssh-keyscan -H -t ed25519 127.0.0.1 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar imagen y comprobar la API
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/com610_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/bin/deploy-libros.sh '$DOCKER_USERNAME/com610-libros' '$SHA'"

      - name: Eliminar clave temporal
        if: always()
        run: |
          rm -f ~/.ssh/com610_key
